plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
    id 'org.jetbrains.kotlin.jvm'
    id "org.jetbrains.kotlin.kapt"
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}
tasks.javadoc {
    // fuck javadoc encode error
    enabled = false
}
dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
//    implementation fileTree(dir: "../depend", includes: ["CooParticlesAPI-Common-1.21.1-2.1.0.jar"])
    implementation("cn.coostack:cooparticlesapi-neoforge:${coo_particles_api_version}") {
        changing = true
    }
    implementation "software.bernie.geckolib:geckolib-common-${minecraft_version}:${geckolib_version}"
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit5:2.2.0"
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
}

sourceSets {
    test {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }


    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
repositories {
    mavenCentral()
}

